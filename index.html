  /* ── Slideshow ── */
.slideshow {
  position:relative;
  width:100%;
  max-width:1200px;   /* ← เพิ่ม */
  margin:0 auto;      /* ← เพิ่ม */
  height: clamp(340px, 60vw, 680px);
  overflow:hidden;
  background:var(--charcoal-mid);
}
  .slide {
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 0.7s ease, transform 0.7s ease;
    transform:scale(1.02);
  }
  .slide.active {
    opacity:1;
    transform:scale(1);
    z-index:1;
  }
  .slide.exit-left  { opacity:0; transform:translateX(-3%) scale(0.99); z-index:0; }
  .slide.exit-right { opacity:0; transform:translateX(3%) scale(0.99); z-index:0; }

  .slide-img {
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .slide-placeholder {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--charcoal-mid) 0%, var(--charcoal-light) 100%);
    color:var(--text-subtle); font-size:13px; letter-spacing:0.2em; text-transform:uppercase;
  }

  /* gradient overlay bottom */
  .slide::after {
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(26,26,26,0.85) 0%, rgba(26,26,26,0.3) 40%, transparent 70%);
    pointer-events:none;
    z-index:2;
  }

  /* caption */
  .slide-caption {
    position:absolute; bottom:0; left:0; right:0;
    z-index:3;
    padding:2rem 5rem 2.5rem;
    pointer-events:none;
  }
  .slide-caption-name {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(1.5rem,3vw,2.5rem);
    font-weight:300;
    line-height:1.2;
    margin-bottom:0.4rem;
    color:var(--cream);
  }
  .slide-caption-sub {
    font-size:12px;
    letter-spacing:0.2em;
    color:var(--gold);
    text-transform:uppercase;
  }

  /* ── Arrow buttons ── */
  .arrow-btn {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:52px; height:52px;
    border:1px solid rgba(201,169,110,0.5);
    background:rgba(26,26,26,0.6);
    backdrop-filter:blur(6px);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.3s ease;
    border-radius:0;
  }
  .arrow-btn:hover {
    background:var(--gold);
    border-color:var(--gold);
  }
  .arrow-btn:hover svg { stroke:var(--charcoal); }
  .arrow-btn svg { width:18px; height:18px; stroke:var(--gold); stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.3s; }
  .arrow-prev { left:1.5rem; }
  .arrow-next { right:1.5rem; }

  /* ── Dots ── */
  .slide-dots {
    display:flex; gap:8px; justify-content:center;
    margin-top:1.5rem;
    padding:0 2rem;
  }
  .dot {
    width:28px; height:2px;
    background:rgba(201,169,110,0.3);
    cursor:pointer;
    transition:all 0.3s;
    border:none;
  }
  .dot.active {
    background:var(--gold);
    width:48px;

  /* ── Counter ── */
  .slide-counter {
    position:absolute;
    top:1.5rem; right:1.5rem;
    z-index:10;
    font-size:11px;
    letter-spacing:0.2em;
    color:rgba(201,169,110,0.8);

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

<!-- ── MAP ── -->
<script>
if (MAP_EMBED_URL && MAP_EMBED_URL.trim() !== '') {
  document.getElementById('map-zone').style.display = 'block';
  document.getElementById('map-wrap').innerHTML =
    `<iframe src="${MAP_EMBED_URL}" allowfullscreen loading="lazy"></iframe>`;
}
</script>

<!-- ── GALLERY ── -->
<script>
(function() {
  const slides = GALLERY_SLIDES;
  const ss = document.getElementById('slideshow');
  const dotsWrap = document.getElementById('slide-dots');
  const counter = document.getElementById('slide-counter');
  let current = 0;
  let animating = false;

  // build slides
  const slideEls = slides.map((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === 0 ? ' active' : '');
    const mediaHTML = s.img
      ? `<img class="slide-img" src="${s.img}" alt="${s.caption}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
         <div class="slide-placeholder" style="display:none;">ไม่พบรูปภาพ</div>`
      : `<div class="slide-placeholder">ยังไม่มีรูปภาพ</div>`;
    div.innerHTML = `${mediaHTML}
      <div class="slide-caption">
        <div class="slide-caption-name notranslate">${s.caption}</div>
        <div class="slide-caption-sub notranslate">${s.sub}</div>
      </div>`;
    ss.insertBefore(div, document.getElementById('slide-counter'));
    return div;
  });

  // build dots
  const dotEls = slides.map((_, i) => {
    const b = document.createElement('button');
    b.className = 'dot' + (i === 0 ? ' active' : '');
    b.setAttribute('aria-label', `Slide ${i+1}`);
    b.onclick = () => goTo(i);
    dotsWrap.appendChild(b);
    return b;
  });

  function updateCounter() {
    counter.textContent = `${current + 1} / ${slides.length}`;
  }

  function goTo(next, dir) {
    if (animating || next === current) return;
    animating = true;
    const prev = current;
    const direction = dir || (next > prev ? 'right' : 'left');

    slideEls[prev].classList.remove('active');
    slideEls[prev].classList.add(direction === 'right' ? 'exit-left' : 'exit-right');
    dotEls[prev].classList.remove('active');

    slideEls[next].classList.add('active');
    dotEls[next].classList.add('active');
    current = next;
    updateCounter();

    setTimeout(() => {
      slideEls[prev].classList.remove('exit-left','exit-right');
      animating = false;
    }, 750);
  }

  document.getElementById('arrow-prev').onclick = () =>
    goTo((current - 1 + slides.length) % slides.length, 'left');
  document.getElementById('arrow-next').onclick = () =>
    goTo((current + 1) % slides.length, 'right');

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  goTo((current - 1 + slides.length) % slides.length, 'left');
    if (e.key === 'ArrowRight') goTo((current + 1) % slides.length, 'right');
  });

  // swipe
  let tx = 0;
  ss.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
  ss.addEventListener('touchend', e => {
    const dx = tx - e.changedTouches[0].clientX;
    if (dx > 50)  goTo((current + 1) % slides.length, 'right');
    if (dx < -50) goTo((current - 1 + slides.length) % slides.length, 'left');
  }, { passive:true });

  // auto-play (optional — comment out ถ้าไม่ต้องการ)
  // setInterval(() => goTo((current + 1) % slides.length, 'right'), 5000);

  updateCounter();

  // hide arrows if only 1 slide
  if (slides.length <= 1) {
    document.getElementById('arrow-prev').style.display = 'none';
    document.getElementById('arrow-next').style.display = 'none';
    dotsWrap.style.display = 'none';
  }
})();
</script>
